name: Build Release APK Secure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json injected successfully."
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret is missing!"
          fi

      - name: Generate Keystore and Properties
        run: |
          keytool -genkey -v -keystore app/my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass password123 -keypass password123 -dname "CN=Android Release,O=Android,C=US"
          echo "storePassword=password123" > app/keystore.properties
          echo "keyAlias=my-key-alias" >> app/keystore.properties
          echo "keyPassword=password123" >> app/keystore.properties
          echo "storeFile=my-upload-key.jks" >> app/keystore.properties

      - name: Build Release APK (Skip Strict Checks)
        env:
          JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.lang=ALL-UNNAMED"
        run: ./gradlew assembleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khahish-Release-App
          path: app/build/outputs/apk/release/*.apk

